root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  entrypoint = "tmp/main.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  # A broken build (typo, unresolved import) keeps the last-good binary
  # running instead of killing it on a bad save.
  stop_on_error = false

[log]
  time = true

[misc]
  # Removes ./tmp on exit so a killed air process doesn't leave a stale
  # binary behind for a plain `go run` to trip over later.
  clean_on_exit = true
